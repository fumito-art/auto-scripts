<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="说说 中国語">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1326" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>说说 中国語会話</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@500;600&family=Noto+Serif+SC:wght@700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  /* 青花(染付)の白と藍。主役は声調の線。レイアウト: 上部ナビ+1カラム、五線譜のような5段の高さ目盛りを全画面の共通モチーフにする */
  --bg: #F2F4F8; --surface: #FFFFFF; --surface-2: #E8ECF5; --ink: #152142; --muted: #5A6685; --line: #D3DAE8;
  --accent: #2346C4; --accent-ink: #FFFFFF; --accent-soft: #E2E8FB; --gold: #C98612; --gold-soft: #FBF0D9;
  --good: #14845A; --warn: #B8720A; --bad: #C43B3B;
  --t1: #D5422E; --t2: #188F56; --t3: #0A8AA0; --t4: #7A3FD0; --t0: #8690A8;
  --hz: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --ui: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  --py: "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  --r: 14px; --shadow: 0 1px 2px rgba(21,33,66,.06), 0 8px 24px rgba(21,33,66,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0D1326; --surface: #171F3A; --surface-2: #212B4C; --ink: #EDF0FA; --muted: #A2ACC8; --line: #2D395E;
    --accent: #8CA5FF; --accent-ink: #0D1326; --accent-soft: #222E5C; --gold: #F0B341; --gold-soft: #3A3018;
    --good: #4FD08B; --warn: #F0B341; --bad: #FF8580;
    --t1: #FF7B66; --t2: #4FD08B; --t3: #3CC6DD; --t4: #B690FF; --t0: #8690A8;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0D1326; --surface: #171F3A; --surface-2: #212B4C; --ink: #EDF0FA; --muted: #A2ACC8; --line: #2D395E;
  --accent: #8CA5FF; --accent-ink: #0D1326; --accent-soft: #222E5C; --gold: #F0B341; --gold-soft: #3A3018;
  --good: #4FD08B; --warn: #F0B341; --bad: #FF8580;
  --t1: #FF7B66; --t2: #4FD08B; --t3: #3CC6DD; --t4: #B690FF; --t0: #8690A8;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 16px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { text-wrap: balance; line-height: 1.3; margin: 0; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
.hz { font-family: var(--hz); font-weight: 700; }
.py { font-family: var(--py); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- ヘッダー ---------- */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 960px; margin: 0 auto; padding: 10px 16px 0; display: flex; flex-direction: column; gap: 8px; }
.top-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: var(--ink); margin-right: auto; }
.brand b { font-family: var(--hz); font-size: 26px; font-weight: 900; letter-spacing: .04em; }
.brand span { font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: .08em; }
.stat { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
.stat svg { width: 16px; height: 16px; }
.stat.streak { color: var(--t1); }
.stat.streak.zero { color: var(--muted); }
.stat.lv { color: var(--accent); }
.xpbar { width: 64px; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.xpbar i { display: block; height: 100%; background: var(--gold); border-radius: 3px; transition: width .8s cubic-bezier(.2,.9,.3,1); }
.nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin: 0 -4px; }
.nav::-webkit-scrollbar { display: none; }
.nav a { flex: none; padding: 8px 12px 10px; font-size: 14px; font-weight: 700; color: var(--muted); text-decoration: none; border-bottom: 3px solid transparent; white-space: nowrap; }
.nav a:hover { color: var(--ink); }
.nav a.on { color: var(--accent); border-bottom-color: var(--accent); }
.nav a .dot { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--t1); color: #fff; font-size: 11px; line-height: 18px; text-align: center; }

.wrap { max-width: 960px; margin: 0 auto; padding: 20px 16px 80px; display: flex; flex-direction: column; gap: 20px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); }
.card.flat { box-shadow: none; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; color: var(--muted); }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sec-h h2 { font-size: 20px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid { display: grid; gap: 14px; }
.g3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.g2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }

/* ---------- ボタン ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px; transition: transform .12s, background .15s, border-color .15s; }
.btn:hover { border-color: var(--accent); }
.btn:active { transform: scale(.96); }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.rec { background: var(--t1); color: #fff; border-color: var(--t1); }
.btn.rec.live { animation: pulse 1.2s infinite; }
.btn.sm { min-height: 34px; padding: 4px 12px; font-size: 13px; }
.btn.ico { width: 42px; padding: 0; border-radius: 50%; }
.btn.ico.sm { width: 34px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.speaking { border-color: var(--accent); background: var(--accent-soft); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--t1) 55%, transparent); } 100% { box-shadow: 0 0 0 14px transparent; } }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 8px 14px; font-weight: 700; font-size: 14px; min-height: 40px; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--surface-2); color: var(--muted); }
.pill.me { background: var(--accent-soft); color: var(--accent); }
.pill.gold { background: var(--gold-soft); color: var(--gold); }

/* ---------- 声調グラフ ---------- */
.tg { width: 100%; display: flex; flex-direction: column; gap: 6px; }
.tg svg { display: block; max-width: 100%; height: auto; overflow: visible; }
.tg .staff { stroke: var(--line); stroke-width: 1; }
.tg .staff.mid { stroke-dasharray: 2 4; }
.tg .ax { font-family: var(--ui); font-size: 10px; fill: var(--muted); font-weight: 700; }
.tg .curve { fill: none; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw .7s cubic-bezier(.3,.7,.2,1) both; animation-delay: calc(var(--i) * 60ms); transition: stroke-width .15s; }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
.tg .nd { animation: pop .3s both; animation-delay: calc(var(--i) * 60ms + .1s); }
@keyframes pop { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: scale(1); } }
.tg .nd { transform-box: fill-box; transform-origin: center; }
.tg .t1 .curve { stroke: var(--t1); } .tg .t1 .nd, .tg .t1 .pyt { fill: var(--t1); }
.tg .t2 .curve { stroke: var(--t2); } .tg .t2 .nd, .tg .t2 .pyt { fill: var(--t2); }
.tg .t3 .curve { stroke: var(--t3); } .tg .t3 .nd, .tg .t3 .pyt { fill: var(--t3); }
.tg .t4 .curve { stroke: var(--t4); } .tg .t4 .nd, .tg .t4 .pyt { fill: var(--t4); }
.tg .t0 .curve { stroke: var(--t0); } .tg .t0 .nd, .tg .t0 .pyt { fill: var(--t0); }
.tg .pyt { font-family: var(--py); font-weight: 600; text-anchor: middle; }
.tg .hzt { font-family: var(--hz); font-weight: 700; fill: var(--ink); text-anchor: middle; }
.tg .pct { font-family: var(--hz); fill: var(--muted); text-anchor: middle; }
.tg .sd { font-family: var(--ui); font-size: 9.5px; font-weight: 700; fill: var(--gold); text-anchor: middle; }
.tg .colbg { fill: var(--accent-soft); opacity: 0; transition: opacity .15s; }
.tg .sy.on .colbg { opacity: 1; }
.tg .sy.on .curve { stroke-width: 6; }
.tg .runner { fill: var(--ink); stroke: var(--surface); stroke-width: 2; }
.tg .usr { fill: none; stroke: var(--gold); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 5; }
.tg .usrd { fill: var(--gold); }
.tg .mk { font-family: var(--ui); font-size: 11px; font-weight: 700; text-anchor: middle; }
.tg .mk.ok { fill: var(--good); } .tg .mk.mid { fill: var(--warn); } .tg .mk.ng { fill: var(--bad); }
.tg.nopy .pyt { display: none; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); font-weight: 500; }
.legend i { display: inline-block; width: 18px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }

/* ---------- ヒーロー ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(220px, 1fr); gap: 16px; }
@media (max-width: 720px) { .hero { grid-template-columns: 1fr; } }
.hero-main { display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden; }
.hero-main h1 { font-size: 15px; color: var(--muted); font-weight: 700; letter-spacing: .1em; }
.hero-ja { font-size: 17px; font-weight: 700; }
.goal { display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; justify-content: center; }
.ring { position: relative; width: 132px; height: 132px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .bg { fill: none; stroke: var(--surface-2); stroke-width: 10; }
.ring .fg { fill: none; stroke: var(--gold); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 1s cubic-bezier(.2,.9,.3,1); }
.ring.acc .fg { stroke: var(--accent); }
.ring .in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; }
.ring .in b { font-size: 30px; font-weight: 700; }
.ring .in span { font-size: 11px; color: var(--muted); font-weight: 700; }
.ring.s { width: 84px; height: 84px; } .ring.s .in b { font-size: 22px; }
.flame { display: inline-block; transform-origin: 50% 90%; animation: flick 1.6s ease-in-out infinite; }
@keyframes flick { 0%, 100% { transform: scale(1) rotate(-2deg); } 50% { transform: scale(1.12) rotate(3deg); } }

/* ---------- コース ---------- */
.course { display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: inherit; transition: transform .15s, border-color .15s; }
.course:hover { transform: translateY(-3px); border-color: var(--accent); }
.course .zh { font-family: var(--hz); font-size: 40px; font-weight: 900; line-height: 1.1; }
.course .zh small { font-family: var(--py); font-size: 13px; font-weight: 600; color: var(--muted); margin-left: 8px; }
.bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; background: var(--accent); transition: width .8s cubic-bezier(.2,.9,.3,1); }
.lvh { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .08em; }
.lvh::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.scn { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; text-decoration: none; color: inherit; padding: 14px 16px; }
.scn:hover:not(.lock) { border-color: var(--accent); }
.scn .zt { font-family: var(--hz); font-size: 22px; font-weight: 700; min-width: 5.2em; }
.scn h3 { font-size: 16px; }
.scn.lock { opacity: .5; cursor: not-allowed; }
.stars { display: flex; gap: 2px; color: var(--line); }
.stars svg { width: 20px; height: 20px; }
.stars .on { color: var(--gold); }
.stars .on.new { animation: starpop .5s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes starpop { from { transform: scale(0) rotate(-40deg); } to { transform: scale(1) rotate(0); } }

/* ---------- シーン ---------- */
.scene-h { display: flex; flex-direction: column; gap: 6px; }
.scene-h .zt { font-family: var(--hz); font-size: 38px; font-weight: 900; line-height: 1.2; }
.back { font-size: 13px; font-weight: 700; color: var(--muted); text-decoration: none; }
.back:hover { color: var(--accent); }
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px; min-height: 40px; }
.tabs button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tabs button .ck { width: 16px; height: 16px; border-radius: 50%; background: var(--good); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; }
.line { display: flex; flex-direction: column; gap: 8px; }
.line.me { border-left: 4px solid var(--accent); }
.line-h { display: flex; align-items: center; gap: 8px; }
.line-h .sp { margin-left: auto; display: flex; gap: 6px; }
.ja { font-size: 15px; }
.noja .ja { display: none; }

/* ---------- 発音練習 ---------- */
.pc { display: flex; flex-direction: column; gap: 12px; }
.pc-live { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); }
.pc-live canvas { display: none; width: 100%; height: 150px; border-radius: 8px; background: var(--surface); }
.pc-live.pitch canvas { display: block; }
.live-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.pc-live.done [data-a="stop"] { display: none; }
.pc-res { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 12px; background: var(--surface-2); animation: rise .35s both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.res-top { display: flex; align-items: center; gap: 14px; }
.res-top h3 { font-size: 18px; }
.adv { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.adv li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline; font-size: 14px; }
.adv .w { font-family: var(--hz); font-weight: 700; font-size: 18px; white-space: nowrap; }
.adv .w small { font-family: var(--py); font-size: 12px; font-weight: 600; margin-left: 4px; }
.heard { font-family: var(--hz); font-size: 20px; letter-spacing: .06em; }
.heard .hit { color: var(--good); } .heard .miss { color: var(--bad); text-decoration: underline wavy; text-underline-offset: 5px; }
.note { font-size: 13px; color: var(--muted); padding: 10px 12px; border-radius: 10px; border: 1px dashed var(--line); }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.dots button { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 12px; font-weight: 700; padding: 0; }
.dots button.on { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.dots button.done { background: var(--good); border-color: var(--good); color: #fff; }

/* ---------- 単語カード ---------- */
.flip { perspective: 1200px; width: min(100%, 420px); height: 250px; margin: 0 auto; cursor: pointer; border: 0; background: none; padding: 0; display: block; }
.flip-in { position: relative; width: 100%; height: 100%; transition: transform .55s cubic-bezier(.3,.9,.3,1); transform-style: preserve-3d; }
.flip.on .flip-in { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); padding: 16px; }
.face.b { transform: rotateY(180deg); background: var(--accent-soft); }
.face .zh { font-family: var(--hz); font-size: 60px; font-weight: 900; line-height: 1.1; }
.face .pyl { font-family: var(--py); font-size: 20px; font-weight: 600; color: var(--muted); }
.face .jl { font-size: 24px; font-weight: 700; }
.fc-out { animation: fcout .28s both; } @keyframes fcout { to { opacity: 0; transform: translateX(var(--dx, 60px)) rotate(var(--rot, 6deg)); } }

/* ---------- ロールプレイ ---------- */
.chat { display: flex; flex-direction: column; gap: 12px; }
.bub { max-width: min(100%, 560px); padding: 12px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; animation: rise .3s both; }
.bub.me { align-self: flex-end; background: var(--accent-soft); border-color: transparent; }
.bub .who { font-size: 12px; font-weight: 700; color: var(--muted); }
.bub .zh { font-family: var(--hz); font-size: 21px; font-weight: 700; line-height: 1.5; }
.bub .pyl { font-family: var(--py); font-size: 13px; color: var(--muted); font-weight: 600; }

/* ---------- クイズ ---------- */
.q { display: flex; flex-direction: column; gap: 14px; }
.q h3 { font-size: 18px; }
.q .big { font-family: var(--hz); font-size: 44px; font-weight: 900; text-align: center; line-height: 1.3; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.opt { text-align: left; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font-weight: 700; min-height: 52px; transition: transform .12s, border-color .15s; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt.ok { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--surface)); animation: okp .4s; }
.opt.ng { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface)); animation: shake .35s; }
@keyframes okp { 50% { transform: scale(1.04); } }
@keyframes shake { 20% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 80% { transform: translateX(-3px); } }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; min-height: 56px; padding: 10px; border-radius: 12px; border: 2px dashed var(--line); align-items: center; }
.tiles.pool { border-style: solid; background: var(--surface-2); border-color: transparent; }
.tile { font-family: var(--hz); font-size: 22px; font-weight: 700; padding: 6px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); min-height: 46px; animation: pop .2s both; }
.qprog { display: flex; gap: 5px; }
.qprog i { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); }
.qprog i.ok { background: var(--good); } .qprog i.ng { background: var(--bad); } .qprog i.cur { background: var(--accent); }

/* ---------- 発音ラボ ---------- */
.pairgrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 560px) { .pairgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  if (!err && ti !== toks.length) err = 'ピンイン過多';

    const n = s.gap === 2 ? null : items[i + 1];

    if (s.ov != null) { kind = String(s.ov); s.sandhi = s.ov !== t; }

/* 1フレーム分のピッチ推定 (NSDF / McLeod)。[周波数, 明瞭度] を返す。無声なら [0, 0] */
function nsdfPitch(x, o, W, fs, tMin, tMax, nsdf) {
  let gmax = 0;
  for (let tau = tMin - 1; tau <= tMax + 1; tau++) {
    let ac = 0, m = 0;
    for (let j = 0; j < W; j++) { const a = x[o + j], b = x[o + j + tau]; ac += a * b; m += a * a + b * b; }

  for (let tau = tMin; tau <= tMax; tau++) if (nsdf[tau] > nsdf[tau - 1] && nsdf[tau] >= nsdf[tau + 1] && nsdf[tau] > gmax) gmax = nsdf[tau];
  if (gmax < 0.5) return [0, 0];
  let pick = -1;
  for (let tau = tMin; tau <= tMax; tau++) {
    if (nsdf[tau] > nsdf[tau - 1] && nsdf[tau] >= nsdf[tau + 1] && nsdf[tau] >= 0.88 * gmax) { pick = tau; break; }
  }
  if (pick < 0) return [0, 0];
  const a = nsdf[pick - 1], b = nsdf[pick], c = nsdf[pick + 1];
  const den = a - 2 * b + c;
  const shift = den !== 0 ? 0.5 * (a - c) / den : 0;
  return [fs / (pick + shift), b];
}

/* 録音中に届いた音声を順に受け取り、10msごとの声の高さをその場で求める */

    frames, hop: H / fs,
    time() { return n / fs; },
    push(chunk) {
      let src = chunk;
      if (carry.length) { src = new Float32Array(carry.length + chunk.length); src.set(carry); src.set(chunk, carry.length); }
      const m = Math.floor(src.length / dec);
      for (let k = 0; k < m && n < x.length; k++) { let q = 0; for (let j = 0; j < dec; j++) q += src[k * dec + j]; x[n++] = q / dec; }

      while (pos + W + tMax + 1 <= n) {
        let e = 0;
        for (let j = 0; j < W; j++) e += x[pos + j] * x[pos + j];
        const rms = Math.sqrt(e / W);
        if (rms > peak) peak = rms;
        let f = 0;
        if (rms >= Math.max(0.008, 0.1 * peak)) {
          const r = nsdfPitch(x, pos, W, fs, tMin, tMax, nsdf);
          if (r[1] >= 0.6) {
            f = r[0];
            const i = frames.length;
            if (prev && i - prevAt <= 1) {
              const ratio = f / prev;
              if (ratio > 1.75 && Math.abs(f / 2 / prev - 1) < 0.22) f /= 2;
              else if (ratio < 0.58 && Math.abs(f * 2 / prev - 1) < 0.22) f *= 2;
            }

/* リアルタイム表示用: 各フレームを5段階の高さに直す。分析本体と同じ基準(声域の学習値があればそれを使う) */

/* ---------- ピッチ抽出 (NSDF / McLeod) ---------- */
function pitchTrack(pcm, sr) {

  const W = Math.round(fs * 0.04), H = Math.round(fs * 0.01);

  const nF = Math.max(0, Math.floor((N - W - tMax) / H));

    let e = 0;
    for (let j = 0; j < W; j++) e += x[o + j] * x[o + j];
    rms[f] = Math.sqrt(e / W);
    if (rms[f] < 0.004) continue;
    const r = nsdfPitch(x, o, W, fs, tMin, tMax, nsdf);
    f0[f] = r[0]; clar[f] = r[1];

  const thr = Math.max(0.006, 0.12 * p95);
  for (let f = 0; f < nF; f++) if (rms[f] < thr || clar[f] < 0.55) f0[f] = 0;

  const v = Array.from(f0).filter(q => q > 0).sort((p, q) => p - q);
  if (v.length) {
    const med = v[Math.floor(v.length / 2)];
    let prev = 0, prevAt = -99;
    for (let f = 0; f < nF; f++) {
      if (!f0[f]) continue;
      if (f0[f] > med * 2.7 || f0[f] < med * 0.36) { f0[f] = 0; continue; }
      if (prev && f - prevAt <= 1) {
        const r = f0[f] / prev;
        if (r > 1.75 && Math.abs(f0[f] / 2 / prev - 1) < 0.22) f0[f] /= 2;
        else if (r < 0.58 && Math.abs(f0[f] * 2 / prev - 1) < 0.22) f0[f] *= 2;

    const on = f < nF && out[f] > 0;

}

/* 発話を音節に分け、各音節の形を目標の声調と比べる */

/* 聞き取られた文字列とお手本の一致度(同音字は一致扱い) */

  const H = Array.from(heard).filter(c => /[㐀-鿿]/.test(c));

  const n = T.length, m = H.length;
  const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++) dp[i][j] = key(T[i - 1]) === key(H[j - 1]) ? dp[i - 1][j - 1] + 1 : Math.max(dp[i - 1][j], dp[i][j - 1]);
  const hit = new Array(n).fill(false);
  let i = n, j = m;
  while (i > 0 && j > 0) {
    if (key(T[i - 1]) === key(H[j - 1]) && dp[i][j] === dp[i - 1][j - 1] + 1) { hit[i - 1] = true; i--; j--; }
    else if (dp[i - 1][j] >= dp[i][j - 1]) i--; else j--;

  return { hit, score: n ? Math.round(100 * dp[n][m] / Math.max(n, m)) : 0, heard: H.join('') };
}

function markPy(base, tone) {

function segment(zh) {

function buildQuiz(sc) {
  const others = SCENES.filter(s => s.id !== sc.id);
  const otherJa = shuffle([].concat(...others.map(s => s.V.map(v => v[2]))));
  const qs = [];
  shuffle(sc.V).slice(0, 2).forEach(v => { qs.push({ type: 'mean', h: 'この単語の意味は？', zh: v[0], py: v[1], opts: shuffle([v[2]].concat(shuffle(sc.V.filter(x => x[2] !== v[2]).map(x => x[2])).slice(0, 2), otherJa.filter(j => j !== v[2]).slice(0, 1))), ans: v[2] }); });
  const ln = shuffle(sc.L)[0];
  qs.push({ type: 'listen', h: '音声を聞いて、意味を選んでください', zh: ln[1], gender: lineGender(sc, ln[0]), opts: shuffle([ln[3]].concat(shuffle(sc.L.filter(x => x !== ln).map(x => x[3])).slice(0, 3))), ans: ln[3] });
  const two = shuffle(sc.V.filter(v => Array.from(v[0]).length === 2))[0] || sc.V[0];
  const syl = parseLine(two[0], two[1]), right = syl.map(s => s.py).join(' '), set = new Set([right]);
  let guard = 0;
  while (set.size < 4 && guard++ < 60) set.add(syl.map(s => markPy(s.base, Math.random() < 0.15 ? s.tone : 1 + Math.floor(Math.random() * 4))).join(' '));
  qs.push({ type: 'tone', h: '正しい声調はどれ？', zh: two[0], sub: two[2], opts: shuffle([...set]), ans: right, py: two[1] });
  const cand = shuffle(sc.L.filter(l => { const n = segment(l[1]).length; return n >= 3 && n <= 7; })).sort((a, b) => (a[0] === 'm' ? 0 : 1) - (b[0] === 'm' ? 0 : 1)).slice(0, 2);
  cand.forEach(l => qs.push({ type: 'order', h: '並べ替えて中国語の文を作ってください', ja: l[3], segs: segment(l[1]), zh: l[1], py: l[2] }));
  return qs;
}
function tQuiz(box, sc, redraw) {

    } else {
      if (q.type === 'listen') { const p = () => Voice.speak(q.zh, { gender: q.gender }); $('#qplay').addEventListener('click', p); p(); }
      $('.opts', box).addEventListener('click', e => {
        const b = e.target.closest('.opt'); if (!b || b.disabled) return;

        $$('.opt', box).forEach(o => { o.disabled = true; if (o.dataset.o === q.ans) o.classList.add('ok'); });
        if (!ok) b.classList.add('ng');
        const src = q.type === 'listen' ? sc.L.find(l => l[1] === q.zh) : null;

      });
    }
  };
  show();
}

  const wk = $('#wk');
  if (!weak.length) wk.innerHTML = '<div class="card flat"><p class="muted">いまのところありません。発音の録音判定をすると、苦手なフレーズがここに集まります。</p></div>';
  weak.forEach(k => { const [sid, i] = k.split('-'), sc = findScene(sid), l = sc && sc.L[+i]; if (!l) return; const c = el('<div class="card flat grid"><div class="row"><span class="pill">' + esc(sc.t) + '</span></div></div>'); c.appendChild(practiceCard({ zh: l[1], py: l[2], ja: l[3] }, { key: k, size: 'md', gender: lineGender(sc, l[0]) })); wk.appendChild(c); });
}

/* ---------- 記録 ---------- */
function vRecord(v) {
  const lv = levelOf(S.xp), C = 2 * Math.PI * 56, t = today();
  const days = []; const start = addDays(t, -(34 + new Date().getDay()));
  for (let d = start; d <= t; d = addDays(d, 1)) days.push(d);
  const learned = Object.values(S.srs).filter(x => x.b >= 1).length, stars = SCENES.reduce((a, s) => a + starsOf(s.id), 0);
  const hs = S.hist.slice(-24), avg = hs.length ? Math.round(hs.reduce((a, h) => a + h.s, 0) / hs.length) : null;
  let sp = '<p class="muted small">録音判定をすると、スコアの推移がここに出ます。</p>';
  if (hs.length >= 2) {
    const W = 600, H = 90, X = i => 8 + i * (W - 16) / (hs.length - 1), Yv = s => 8 + (100 - s) / 100 * (H - 16);
    const pts = hs.map((h, i) => X(i).toFixed(1) + ',' + Yv(h.s).toFixed(1)).join(' ');
    sp = '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="発音スコアの推移"><line x1="0" x2="' + W + '" y1="' + Yv(80) + '" y2="' + Yv(80) + '" stroke="var(--line)" stroke-dasharray="3 5"/><polygon points="8,' + (H - 4) + ' ' + pts + ' ' + (W - 8) + ',' + (H - 4) + '" fill="var(--accent-soft)"/><polyline points="' + pts + '" fill="none" stroke="var(--accent)" stroke-width="2.5" vector-effect="non-scaling-stroke"/><circle cx="' + X(hs.length - 1) + '" cy="' + Yv(hs[hs.length - 1].s) + '" r="5" fill="var(--gold)"/></svg><p class="small muted">直近' + hs.length + '回の発音スコア(点線は80点)</p>';
  }
  v.innerHTML = '<div class="sec-h"><h2>学習の記録</h2><span class="small muted">' + (Store.mode === 'cloud' ? '記録はこのアカウントに保存されています' : '記録はこのブラウザに保存されています') + '</span></div>' +
    '<section class="hero"><div class="card grid"><div class="kpis"><div class="kpi"><b class="num">' + S.xp + '</b><span>累計XP</span></div><div class="kpi"><b class="num">' + S.streak.best + '<small style="font-size:14px">日</small></b><span>最長連続</span></div><div class="kpi"><b class="num">' + stars + '<small style="font-size:14px"> / ' + SCENES.length * 3 + '</small></b><span>獲得した★</span></div><div class="kpi"><b class="num">' + learned + '</b><span>覚えた単語</span></div><div class="kpi"><b class="num">' + (avg == null ? '–' : avg) + '</b><span>発音スコア平均</span></div></div><div><p class="eyebrow" style="margin-bottom:8px">直近5週間の学習</p><div class="heat">' + days.map(d => { const x = S.days[d] || 0; return '<i class="' + (x >= S.set.goal ? 'l3' : x >= S.set.goal / 2 ? 'l2' : x > 0 ? 'l1' : '') + (d === t ? ' today' : '') + '" title="' + d + '：' + x + ' XP"></i>'; }).join('') + '</div><p class="small muted" style="margin-top:6px">濃い色＝1日の目標(' + S.set.goal + ' XP)を達成した日</p></div></div>' +
    '<div class="card goal"><p class="eyebrow">現在のレベル</p><div class="ring acc"><svg viewBox="0 0 132 132"><circle class="bg" cx="66" cy="66" r="56"/><circle class="fg" cx="66" cy="66" r="56" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - lv.cur / lv.need)).toFixed(1) + '"/></svg><div class="in"><span>Lv</span><b class="num">' + lv.L + '</b></div></div><p><b>' + esc(titleOf(lv.L)) + '</b><br><span class="small muted">次のレベルまで <span class="num">' + (lv.need - lv.cur) + '</span> XP</span></p></div></section>' +
    '<section class="card grid"><p class="eyebrow">発音スコアの推移</p>' + sp + '</section>' +
    '<section class="grid"><div class="sec-h"><h2>コースの進み具合</h2></div><div class="grid g3" id="cs"></div></section>' +
    '<section class="grid"><div class="sec-h"><h2>バッジ</h2><span class="small muted num">' + Object.keys(S.badges).length + ' / ' + BADGES.length + '</span></div><div class="badges">' + BADGES.map(b => '<div class="badge ' + (S.badges[b.id] ? 'on' : '') + '" title="' + esc(b.desc) + '"><span class="seal" lang="zh-CN">' + b.seal + '</span>' + esc(b.name) + '<span class="small muted" style="font-weight:500">' + esc(b.desc) + '</span></div>').join('') + '</div></section>';
  courseCards($('#cs'));
}

/* ---------- 音声と設定 ---------- */
function vVoice(v) {
  const eng = Voice.engine(), devs = Voice.dev;
  const how = g => { const p = Voice.pick(g); return p.how === 'none' ? 'なし' : esc(p.voice.name) + ({ chosen: '', native: '', pseudo: (g === 'm' ? '（声を低くして男性の声として代用）' : '（声を高くして女性の声として代用）'), elo: '（旧式の合成音）' })[p.how]; };
  const optV = g => '<option value="">自動で選ぶ(おすすめ)</option>' + devs.map(x => '<option value="' + esc(x.voiceURI) + '" ' + ((g === 'm' ? S.set.vM : S.set.vF) === x.voiceURI ? 'selected' : '') + '>' + esc(x.name) + '（' + ({ m: '男性', f: '女性', '?': '性別不明' })[Voice.genderOf(x)] + '・' + esc(x.lang) + (Voice.isElo(x) ? '・旧式の合成音' : '') + '）</option>').join('');
  const optC = g => ['airy', 'buttery', 'glassy', 'rounded'].map(n => '<option ' + ((g === 'm' ? S.set.cvM : S.set.cvF) === n ? 'selected' : '') + '>' + n + '</option>').join('');
  const mode = recMode();
  const noNatM = devs.length && Voice.pick('m').how !== 'native' && Voice.pick('m').how !== 'chosen';
  v.innerHTML = '<div class="sec-h"><h2>音声と設定</h2></div>' +
    '<section class="card grid"><p class="eyebrow">お手本の声</p>' +
    (eng === 'none' ? '<p class="note" style="border-color:var(--bad);color:var(--ink)"><b>この画面では中国語の音声を再生できません。</b>端末に中国語(普通話)の音声が見つからないためです。日本語の音声で読み上げると誤った発音になるので、再生を止めています。' + (IOS ? 'iPhoneの「設定 → アクセシビリティ → 読み上げコンテンツ → 声」で中国語(中国本土)の音声を追加してから、このページを読み込み直してください。' : 'Chromeで開くファイル版をお使いください。') + '</p>' : '') +
    '<div class="row"><div class="seg" id="gender"><button data-g="f" class="' + (S.set.gender === 'f' ? 'on' : '') + '">女性の声</button><button data-g="m" class="' + (S.set.gender === 'm' ? 'on' : '') + '">男性の声</button></div><button class="btn" id="test">' + IC.play + '試しに聞く</button></div>' +
    '<label class="sw"><input type="checkbox" id="duo" ' + (S.set.duo ? 'checked' : '') + '>会話では、相手のセリフを相手の性別の声で読む</label>' +
    '<div class="field"><label for="rate">話す速さ <span class="num" id="ratev">' + S.set.rate.toFixed(2) + '</span>倍</label><input type="range" id="rate" min="0.6" max="1.2" step="0.05" value="' + S.set.rate + '"></div>' +
    '<div class="field"><span class="lab">いま使っている音声</span><p class="small" id="diag">' + (eng === 'device' ? '端末の中国語音声　女性：<b>' + how('f') + '</b>　／　男性：<b>' + how('m') + '</b>' : eng === 'claude' ? '<b>Claudeの音声(中国語)</b>' : '<b>なし</b>') + '<br><span class="muted">端末の中国語音声 <span class="num">' + devs.length + '</span> 種類　／　Claudeの音声：' + (Voice.tts ? (Voice.ttsZh ? '中国語に対応' : '中国語に未対応のため使いません') : 'この画面では使えません') + '</span></p></div>' +
    (Voice.ttsOK() ? '<div class="field"><span class="lab">音声の種類</span><div class="seg" id="engine"><button data-e="auto" class="' + (S.set.engine !== 'claude' ? 'on' : '') + '">端末の音声</button><button data-e="claude" class="' + (S.set.engine === 'claude' ? 'on' : '') + '">Claudeの音声</button></div></div>' : '') +
    (devs.length ? '<div class="grid g2"><div class="field"><label for="vF">女性の声に使う音声</label><select id="vF">' + optV('f') + '</select></div><div class="field"><label for="vM">男性の声に使う音声</label><select id="vM">' + optV('m') + '</select></div></div>' : '') +
    (Voice.ttsOK() ? '<div class="grid g2"><div class="field"><label for="cvF">Claudeの音声(女性の声として使う)</label><select id="cvF">' + optC('f') + '</select></div><div class="field"><label for="cvM">Claudeの音声(男性の声として使う)</label><select id="cvM">' + optC('m') + '</select></div></div>' : '') +
    '<p class="note">声の質(年代・性別)は、端末やブラウザに入っている音声で決まります。' + (noNatM ? '<b>この端末には自然な男性の中国語音声がありません。</b>男性の声は、女性の音声の高さを下げて代用しています。' : '') + (IOS ? 'iPhoneは「設定 → アクセシビリティ → 読み上げコンテンツ → 声 → 中国語」から音声を追加できます(Li-mu は男性、Lili・Yu-shu などは女性の声です)。追加後にこのページを読み込み直すと、下の一覧から選べます。' : 'Microsoft Edge で開くと、若い男女の自然な音声(Yunxi・Xiaoxiao など)が使えます。Mac は「システム設定 → アクセシビリティ → 読み上げコンテンツ → システムの声 → 声を管理」から中国語(中国本土)の音声を追加できます。') + '</p></section>' +
    '<section class="card grid"><p class="eyebrow">録音と判定</p><p class="small">この表示での判定方法：<b>' + ({ mic: 'マイクで録音して、声の高さの動きを分析', dict: '聞き取り判定(話した中国語が正しく聞き取れるか)', none: '録音ファイルの読み込みのみ' })[mode] + '</b></p>' +
    (mode !== 'mic' ? '<p class="note">この表示ではマイクの音声を直接取得できません。' + (IOS ? 'iPhoneでは、Safariで開く公開ページ版なら、その場で録音して声の高さを分析できます。' : 'Chromeで開くファイル版では、その場で録音して声の高さの波形を分析できます。') + '</p>' : IOS ? '<p class="small muted">iPhoneでは、声の高さ(声調)の分析に絞って判定します。話した内容の聞き取り判定は、パソコンのChromeで使えます。</p>' : '<label class="sw"><input type="checkbox" id="sr" ' + (S.set.sr ? 'checked' : '') + '>録音と同時に、話した内容の聞き取り判定もする(Chrome)</label>') +
    (S.range ? '<p class="small muted">あなたの声域を学習済みです。高さの判定はこの声域を基準にしています。<button class="btn sm" id="rr">声域をリセット</button></p>' : '<p class="small muted">録音を重ねると、あなたの声域(低い所と高い所)を学習して判定が安定します。</p>') + '</section>' +
    '<section class="card grid"><p class="eyebrow">学習</p><div class="field"><label for="goal">1日の目標</label><select id="goal">' + [30, 50, 80, 120].map(g => '<option value="' + g + '" ' + (S.set.goal === g ? 'selected' : '') + '>' + g + ' XP（' + ({ 30: '約5分', 50: '約10分', 80: '約15分', 120: '約25分' })[g] + '）</option>').join('') + '</select></div><label class="sw"><input type="checkbox" id="unlock" ' + (S.set.unlock ? 'checked' : '') + '>すべてのシーンを最初から開く</label><div class="row"><button class="btn" id="reset">学習記録をすべて消す</button><span class="small muted" id="resetmsg"></span></div></section>';
  const sv = () => { Store.save(); };
  $('#gender').addEventListener('click', e => { const b = e.target.closest('[data-g]'); if (!b) return; S.set.gender = b.dataset.g; sv(); $$('#gender button').forEach(x => x.classList.toggle('on', x === b)); Voice.speak('你好，很高兴认识你。', {}); });
  $('#test').addEventListener('click', () => Voice.speak('你好，我们一起学中文吧！', {}));
  $('#duo').addEventListener('change', e => { S.set.duo = e.target.checked; sv(); });
  $('#rate').addEventListener('input', e => { S.set.rate = +e.target.value; $('#ratev').textContent = S.set.rate.toFixed(2); sv(); });
  if ($('#engine')) $('#engine').addEventListener('click', e => { const b = e.target.closest('[data-e]'); if (!b) return; S.set.engine = b.dataset.e; sv(); App.render(); });
  [['vF'], ['vM'], ['cvF'], ['cvM']].forEach(([k]) => { const s = $('#' + k); if (s) s.addEventListener('change', () => { S.set[k] = s.value; sv(); Voice.speak('你好，很高兴认识你。', { gender: k.endsWith('M') ? 'm' : 'f' }); }); });
  if ($('#sr')) $('#sr').addEventListener('change', e => { S.set.sr = e.target.checked; sv(); });
  if ($('#rr')) $('#rr').addEventListener('click', () => { S.range = null; sv(); App.render(); });
  $('#goal').addEventListener('change', e => { S.set.goal = +e.target.value; sv(); App.header(); });
  $('#unlock').addEventListener('change', e => { S.set.unlock = e.target.checked; sv(); });
  let armed = false;
  $('#reset').addEventListener('click', () => {
    if (!armed) { armed = true; $('#reset').textContent = 'もう一度押すと消去します'; $('#resetmsg').textContent = 'XP・★・単語の記録がすべて消えます。元に戻せません。'; return; }
    const keep = S.set; S = DEF(); S.set = keep; Store.save(); Store.flush(); App.refresh(); toast('学習記録を消去しました');
  });
}

/* ---------- 起動 ---------- */
let touched = false;
function boot() {
  ['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, () => { touched = true; }, { once: true, capture: true }));
  if (IOS) { let un = false; ['touchend', 'click'].forEach(ev => addEventListener(ev, () => { if (un) return; un = true; unlockAudio(); }, { capture: true })); }
  if (IOS) {
    document.documentElement.classList.add('ios');
    const nv = document.querySelector('#novoice .novoice-in');
    if (nv) nv.innerHTML = '<b>中国語の音声が見つかりません。</b>iPhoneの「設定 → アクセシビリティ → 読み上げコンテンツ → 声」で中国語(中国本土)の音声を追加して、このページを読み込み直してください。<a href="#voice">音声と設定を見る</a>';
  }
  Store.loadLocal();
  buildPyMap();
  Voice.load();
  if ('speechSynthesis' in window && speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', () => { const n = Voice.dev.length; Voice.load(); if (Voice.dev.length !== n) { App.header(); if (App.name() === 'voice') App.render(); } });
  Voice.waitVoices().then(() => { App.header(); if (App.name() === 'voice' && !touched) App.render(); });
  App.render();
  addEventListener('hashchange', () => { App.render(); scrollTo(0, 0); });
  if (window.claude && window.claude.use) {
    window.claude.use('tts').then(async t => {
      Voice.tts = t || null;
      if (t) { let ls; try { ls = t.languages ? await t.languages() : undefined; } catch (e) { ls = undefined; } Voice.ttsLangs = ls || null; Voice.ttsZh = Array.isArray(ls) && ls.some(x => /^(zh|cmn)/i.test(x)); }
      App.header(); if (App.name() === 'voice' && !touched) App.render();
    }).catch(() => {});
    window.claude.use('dictation').then(d => { const had = recMode(); Dict = d || null; if (recMode() !== had && !touched) App.render(); }).catch(() => {});
  }
  Store.initCloud();
  document.addEventListener('visibilitychange', () => { if (document.hidden) { Voice.stop(); if (Mic.stopFn) Mic.stopFn(); Mic.release(); Store.flush(); } });
  addEventListener('pagehide', () => { Store.flush(); });
}
boot();
